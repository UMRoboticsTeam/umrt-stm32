name: Build and Test

on:
  pull_request:
    branches: [ "main" ]
    types: [ "closed" ]

  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  find-all-cmake-jobs:
    runs-on: ubuntu-latest

    outputs:
      dirs: ${{ steps.cmake-jobs.outputs.dirs}}
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          path: repo
      
      - name: Find all CMake.txt 
        id: cmake-jobs
        run: |
          cd repo
          DIRECTORY=$(find . \( -name "CMakeLists.txt" \) -printf '%h\n' | sort -u | jq -R . | jq -cs '{include: map({project_dir: .})}')
          echo "dirs=$DIRECTORY" >> "$GITHUB_OUTPUT"
      
      - name: Get Version
        id: version
        run: |
          cd repo
          echo "VERSION=$(cat version)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.version.outputs.VERSION }}"
          gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Automated build for $TAG_NAME" || true

  build-sim:
    runs-on: ubuntu-latest
    needs: find-all-cmake-jobs

    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    strategy:
      matrix: ${{ fromJson(needs.find-all-cmake-jobs.outputs.dirs) }}
      fail-fast: false

    container:
      image: ghcr.io/umroboticsteam/umrt-stm32-tester-build-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --entrypoint /bin/bash

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Build Code
        run: |
          cd repo/${{ matrix.project_dir }}
          rm -rf build
          cmake -S . -B build \
            -DRE_SIMULATION=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-O0 -g3" \
            -DCMAKE_CXX_FLAGS="-O0 -g3"
          cmake --build build

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ needs.find-all-cmake-jobs.outputs.version }}"

          cd repo/${{ matrix.project_dir }}/build
          for file in ./*; do
            base="${file##*/}"
            name="${base%.*}"
            ext="${base##*.}"

            if [ -f "$file" ]; then
              if file -b "$file" | grep -q "^ELF"; then
                if [ "$name" = "$base" ]; then
                  new_name="${base}-sim"
                else
                  new_name="${name}-sim.${ext}"
                fi
                mv "$file" "$new_name"
                gh release upload "$TAG_NAME" "$new_name" --clobber
              fi
            fi
          done
    
  build-stm:
    runs-on: ubuntu-latest
    needs: find-all-cmake-jobs
    
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    strategy:
      matrix: ${{ fromJson(needs.find-all-cmake-jobs.outputs.dirs) }}
      fail-fast: false

    container:
      image: ghcr.io/umroboticsteam/umrt-stm32-tester-build-image
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --entrypoint /bin/bash

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Build Code
        run: |
          cd repo/${{ matrix.project_dir }}
          rm -rf build
          cmake -S . -B build -DRE_SIMULATION=OFF
          cmake --build build

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ needs.find-all-cmake-jobs.outputs.version }}"
          
          cd repo/${{ matrix.project_dir }}/build
          
          for file in ./*; do
            base="${file##*/}"
            name="${base%.*}"
            ext="${base##*.}"

            if [ -f "$file" ]; then
              if file -b "$file" | grep -q "^ELF"; then
                if [ "$name" = "$base" ]; then
                  new_name="${base}-stm"
                else
                  new_name="${name}-stm.${ext}"
                fi
                mv "$file" "$new_name"
                gh release upload "$TAG_NAME" "$new_name" --clobber
              fi
            fi
          done
