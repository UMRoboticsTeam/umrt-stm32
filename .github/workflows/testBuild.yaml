name: Build and Test

on:
  push:
  pull_request:

jobs:
  build-stm-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project_dir: [ "PWM_TEST" ]
      fail-fast: false

    container:
      image: ghcr.io/umroboticsteam/umrt-stm32-tester-build-image
      credentials:
        username: ${{ github.actor }}
        password: ${{secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Build Code
        run: |
          cd repo/${{ matrix.project_dir }}
          rm -rf build
          cmake -S . -B build
          cmake --build build

      - name: Test Code
        run: |
          cd repo/${{ matrix.project_dir }}/Simulation
          chmod +x ./testrun.sh
          ./testrun.sh
